[profile.default]
src = "contracts/src"
test = "contracts/test"
script = "contracts/script"
out = "contracts/out"
cache_path = "contracts/cache"
libs = ["node_modules", "lib"]
solc_version = "0.8.30"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
fs_permissions = [{ access = "read", path = "./fixtures" }]

[rpc_endpoints]
gnosis = "${GNOSIS_RPC_URL}"

[invariant]
runs = 128
depth = 64
fail_on_revert = true

[fmt]
line_length = 120
